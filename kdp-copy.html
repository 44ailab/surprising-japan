<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KDPコピー用</title>
<style>
body{font-family:-apple-system,sans-serif;margin:16px;background:#fff;color:#111}
h1{font-size:20px} h2{font-size:16px;margin-top:28px}
button{display:block;width:100%;padding:18px;font-size:18px;margin:10px 0;border-radius:10px;border:1px solid #888;background:#ffd814}
button.kw{background:#eef;font-size:15px;padding:12px}
.done{background:#4caf50 !important;color:#fff}
p.note{font-size:13px;color:#555}
</style></head><body>
<h1>KDP登録用コピー</h1>
<p class="note">ボタンを押すと全文がコピーされる。KDPの画面に戻って貼り付ける。</p>
<h2>1. 商品説明（Source画面に貼る）</h2>
<button id="descBtn">説明文を全部コピー</button>
<h2>2. キーワード（1枠ずつ貼る）</h2>
<div id="kws"></div>
<script>
const DATA = {"desc": "<p><b>There are two days when Japanese families never put up their New Year decorations — doing it on those days is said to bring bad luck.</b></p>\n<p><i>Surprising Japan</i> is a short, illustrated guide to a full year of Japanese festivals and customs — 37 pages, one month at a time, in short, plain English. I live in Japan, and these are the small, unwritten rules that Japanese families follow every year without thinking, and that nobody ever explains to visitors. So I wrote them down.</p>\n<p>Nobody opens an omamori good-luck charm — the protection is said to escape if you do. In February, the custom is to eat a whole sushi roll in complete silence, facing the year's lucky direction. And if you want fried chicken on Christmas Eve, you reserve it weeks ahead. Completely seriously.</p>\n<p><b>One full year inside a Japanese home:</b></p>\n<ul>\n<li><b>January</b> — New Year: the money envelopes for children (and how much goes inside, by age), shrine fortunes, and why decorations come down on different days in Tokyo and Kyoto</li>\n<li><b>February</b> — Setsubun: throwing beans at a demon, and the sushi roll you eat in total silence</li>\n<li><b>March</b> — Hinamatsuri: the doll display, and the superstition about putting it away too late</li>\n<li><b>April</b> — Hanami: cherry-blossom picnics, and why everyone lines their shoes up at the edge of the sheet</li>\n<li><b>May</b> — Children's Day: the flying carp streamers, and what each color means</li>\n<li><b>June</b> — The rainy season, and the giant grass ring you walk through in a figure of eight</li>\n<li><b>July</b> — Tanabata: writing a wish and hanging it on bamboo</li>\n<li><b>August</b> — Obon: the cucumber horse and the eggplant cow that carry the ancestors home</li>\n<li><b>September</b> — Moon viewing, and the old belief that you should never view just one of the two moons</li>\n<li><b>October</b> — School sports day: red-and-white caps, the ball-toss game, and the parents' camera forest</li>\n<li><b>November</b> — Shichi-Go-San: children of seven, five, and three in kimono, and the thousand-year candy</li>\n<li><b>December</b> — Christmas, Japanese style (fried chicken, strawberry cake, and a normal workday on the 25th), then the great cleaning and the 108 temple bells of New Year's Eve</li>\n</ul>\n<p>Every month comes with a warm illustration and is written in short, plain English — easy to read even if English is not your first language.</p>\n<p><b>This book is for you if</b> you plan to visit Japan, you live in Japan, your partner or family is Japanese, or you are simply curious about how daily life here really works.</p>\n<p><b>Honestly, it is not for you if</b> you are looking for something else: this is not a travel itinerary (no hotel, restaurant, or transport listings), not a Japanese-language textbook (no lessons or phrase drills), and not an academic history of Japan. It will not plan your trip day by day. What it does is simpler — after reading it, the things you see in Japan stop being strange and start making sense.</p>\n<p><i>Surprising Japan</i> — one year of Japanese home life, month by month.</p>", "keywords": ["japanese festivals and traditions", "japanese customs explained setsubun obon tanabata", "japanese culture for beginners", "japanese seasonal celebrations year round", "living in japan cultural traditions", "japanese family traditions guide", "gift for japan culture lovers"]};
async function copyText(t, btn){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.classList.add('done'); btn.textContent='コピーできた ✓';
}
document.getElementById('descBtn').addEventListener('click', e=>copyText(DATA.desc, e.target));
const wrap=document.getElementById('kws');
DATA.keywords.forEach((k,i)=>{
  const b=document.createElement('button'); b.className='kw';
  b.textContent=(i+1)+'. '+k;
  b.addEventListener('click', ()=>copyText(k, b));
  wrap.appendChild(b);
});
</script></body></html>
